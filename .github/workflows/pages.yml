# Builds the web app and publishes it to the gh-pages branch on every push to main.
# GitHub Pages serves that branch at https://karandhayal.github.io/eureka-finals/,
# the same /eureka-finals/ path the app uses on ecell.in/eureka-finals.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          BASE: /eureka-finals/
      - run: cp web/dist/index.html web/dist/404.html && touch web/dist/.nojekyll && rm -f web/dist/_headers
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
