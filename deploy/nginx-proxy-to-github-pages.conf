# Serve ecell.in/eureka-finals/ from GitHub Pages without copying files to the ecell.in server.
# Add inside the existing "server { ... }" block for ecell.in (the HTTPS one), then:
#   sudo nginx -t && sudo systemctl reload nginx
location = /eureka-finals { return 301 /eureka-finals/; }
location /eureka-finals/ {
    proxy_pass https://karandhayal.github.io/eureka-finals/;
    proxy_set_header Host karandhayal.github.io;
    proxy_ssl_server_name on;
    proxy_ssl_name karandhayal.github.io;
    proxy_redirect https://karandhayal.github.io/eureka-finals/ /eureka-finals/;
}
