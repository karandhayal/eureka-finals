# Add inside the existing "server { ... }" block for ecell.in, then: sudo nginx -t && sudo systemctl reload nginx
# Files go in <web root>/eureka-finals/ (unzip eureka-finals-ecell-in.zip in the web root).
location = /eureka-finals { return 301 /eureka-finals/; }
location /eureka-finals/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location /eureka-finals/ {
    try_files $uri $uri/ /eureka-finals/index.html;
    add_header Cache-Control "no-cache";
}
